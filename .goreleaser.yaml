# How this repository turns a tag into something people install.
#
# Everything else here decides what the binary does. This decides what
# people RECEIVE, which is the one part of the product where the person
# to design against is not a user with an odd project but somebody who
# would like their code on other people's machines.
#
# Three properties are worth stating before the settings that produce
# them:
#
#   1. THE BUILD IS ONE COMMAND, named explicitly. This module also
#      carries a program the build invokes and ships to nobody. A target
#      written as a wildcard would publish it as a release artefact.
#   2. THE SAME TAG REBUILDS TO THE SAME BYTES, for the Linux and Windows
#      archives. Trimmed paths, a fixed module timestamp and stamps
#      derived from the commit rather than from the clock. Reproducibility
#      is what lets anyone check that the published binary is the
#      published source; without it that claim is unfalsifiable and
#      therefore worth nothing.
#
#      THE macOS ARCHIVES DIFFER BY THEIR SIGNATURE, and only by it. The
#      binary inside is the same build, then signed with a developer
#      certificate and a secure timestamp, which nobody without the key
#      can reproduce. checksums.txt records a digest per archive and says
#      which is which by its name: a rebuild matches every linux and
#      windows line and none of the darwin ones.
#   3. THE CHECKSUMS ARE SIGNED, keylessly, by the workflow's own
#      identity. A checksum says the file did not change in transit. It
#      cannot say who built it, and that is the question somebody
#      installing a binary is actually asking.
#
# Nothing here is fired by a script. A tag push is what starts a release,
# and the brake in front of it is the deployment environment the
# publishing job runs in — server-side, and not bypassable by declining
# to use a wrapper.
version: 2

project_name: curious

before:
  hooks:
    - go mod download

builds:
  - id: curious
    # NAMED, not inferred. See property 1 above: the module root builds
    # more than the product.
    main: ./cmd/curious
    binary: curious
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    # No ignore list. Every pair the two lists produce is a machine
    # somebody is sitting at.
    flags:
      - -trimpath
    # -s -w drop the symbol and debug tables: smaller download, and
    # nothing a user of a CLI loses. The three stamps are what make an
    # installed binary able to say what it is; a plain `go build` leaves
    # them at their honest defaults instead of guessing.
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}}
    # The commit's own timestamp rather than the moment of building, so
    # two builds of one tag are byte-identical.
    mod_timestamp: "{{ .CommitTimestamp }}"

# TWO ARCHIVES, TWO AUDIENCES, and the split is forced rather than
# chosen. A person downloading from the releases page should get the
# licence and the readme beside the binary; the npm wrapper's install
# script has to OPEN what it downloads, and Node's standard library
# reads neither of the formats that can carry three files.
#
# So the first archive is for people and the second is for the wrapper.
# They cannot be merged: a compression-only format holds exactly one
# member, and stripping the licence out of every human download to
# please an install script is the wrong trade for an MIT-licensed tool.
#
# The names do not collide — one ends .tar.gz and the other .gz — and
# one checksum file covers both.
archives:
  - id: curious
    ids: [curious]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    # The one platform whose users cannot be assumed to have a tar.
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

  # The wrapper's archive: a plain gzip whose only member is the
  # binary, which one standard-library call opens with no parsing code
  # at all.
  - id: curious-gz
    ids: [curious]
    # RESTATED RATHER THAN INHERITED. Left out, the default template
    # produces a differently-spelled name, and every download address
    # the install script builds would miss by a word.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [gz]
    # EMPTIED ON PURPOSE. An archive's file list defaults to the licence
    # and readme globs, and a compression-only format errors on the
    # second member — so without this the release does not degrade, it
    # fails to build.
    files: ["none*"]

# THE macOS BINARIES ARE SIGNED AND NOTARISED, because an unsigned one is
# killed by the operating system on any Mac that has not exempted the
# terminal running it. The package manager marks what it downloads as
# quarantined, and a quarantined binary with no developer signature is
# refused outright, with a dialog calling it possible malware.
#
# BOTH MODES SIGN, and the difference is the certificate:
#
#   - A SNAPSHOT signs with a throwaway chain generated in the job
#     (scripts/snapshot-macos-cert.sh) and does not notarise. So the
#     signing path runs on every pull request. The alternative is a path
#     first executed inside a release somebody has already approved, and
#     the cosign block below records what that cost once.
#   - A RELEASE signs with the developer certificate and notarises. Every
#     value comes from the environment, and the release workflow checks
#     all five are non-empty BEFORE this tool runs. That check is not
#     belt and braces: the tool signs without notarising, logging it at
#     info level, whenever any notary value renders empty, and a secret
#     that does not exist reaches a workflow as an empty string rather
#     than as an error.
#
# `enabled` is a constant, not "is the certificate variable set". A gate
# that switches signing off when a secret is missing is a release that
# ships unsigned and reports green.
#
# This runs after the build and before any archive exists, so a failure
# here, a notarisation timeout included, publishes nothing.
notarize:
  macos:
    - enabled: true
      ids: [curious]
      sign:
        certificate: '{{ if .IsSnapshot }}.snapshot-keys/macos.p12{{ else }}{{ .Env.MACOS_SIGN_P12 }}{{ end }}'
        password: '{{ if .IsSnapshot }}snapshot{{ else }}{{ .Env.MACOS_SIGN_PASSWORD }}{{ end }}'
      notarize:
        issuer_id: '{{ if not .IsSnapshot }}{{ .Env.MACOS_NOTARY_ISSUER_ID }}{{ end }}'
        key_id: '{{ if not .IsSnapshot }}{{ .Env.MACOS_NOTARY_KEY_ID }}{{ end }}'
        key: '{{ if not .IsSnapshot }}{{ .Env.MACOS_NOTARY_KEY }}{{ end }}'
        wait: true
        # The tool's ceiling: a longer wait needs a longer-lived token,
        # which the notary service refuses.
        timeout: 20m

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Keyless signing over the checksum file. Signing the checksums covers
# every artefact through one signature, and the identity in the
# certificate is the workflow that produced them rather than a key
# somebody holds — so there is no private key to leak, rotate or lose,
# and the answer to "was this built by that repository's release
# workflow" is checkable by anyone.
#
# A SNAPSHOT BUILD DOES NOT SKIP THIS, which was worth finding out by
# running rather than by reading. The tool's own summary of a snapshot
# says it skips announcing, publishing and validation — signing is not on
# that list, and a snapshot with no signing tool installed fails at the
# last step (v2.18.1, measured 2026-09-07). The pull-request check does
# not skip it either: it signs, with a key pair generated in the job, as
# the paragraphs below describe. The only build that skips the stage is a
# local one on a machine without the signer, and the Makefile target says
# so when it does. This paragraph used to say the pull-request check
# skipped signing, which stopped being true when the key pair arrived and
# contradicted the paragraphs below it until it was corrected.
#
# THE RESIDUE THIS PARAGRAPH USED TO NAME IS THE DEFECT THAT CAME DUE, so
# it is recorded as history rather than deleted. It said: nothing
# exercises this block until the first real release, because a keyless
# signature needs an identity and an identity exists only inside an
# approved publishing run. Every word was true, and naming a gap is not
# covering one. The signing tool's pin moved to a major where the output
# flags this block used to pass are insufficient; the first execution of
# the path was the first release, forty-nine seconds after a person
# approved the irreversible step, and it failed there.
#
# WHAT CHANGED IS WHICH HALF WAITS. The identity still waits for a
# release — nothing can fake one, and nothing should. The ARGUMENTS do
# not: the snapshot build signs with a key pair generated in the job, so
# the flags below run on every pull request and a pin that moves under
# them reds there instead of at a tag. Only the two identity arms differ
# between the modes.
#
# THE ARMS ARE BOTH REAL FLAGS, WHICH IS NOT COSMETIC. An arm that
# renders to nothing does not vanish: it becomes an empty argument, and
# the signer reads it as a path — measured, `reading payload: read .: is
# a directory`. So the release side repeats a boolean it already passes
# rather than rendering blank.
#
# The bundle is declared as the signature so the tool knows it was
# produced. Without that it warns, says the warning becomes an error in
# its next major, and — the part that matters — does not publish the file,
# which would leave the verify command printed by scripts/cut-release.sh
# with nothing to download.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: ${artifact}.bundle
    output: true
    args:
      - sign-blob
      - --yes
      - --bundle=${artifact}.bundle
      - '{{ if .IsSnapshot }}--key=.snapshot-keys/cosign.key{{ else }}--yes{{ end }}'
      - '{{ if .IsSnapshot }}--use-signing-config=false{{ else }}--yes{{ end }}'
      - '{{ if .IsSnapshot }}--tlog-upload=false{{ else }}--yes{{ end }}'
      - ${artifact}

# The tap lives in its own repository, so the job's own token cannot
# write to it: a release either names a credential scoped to that one
# repository or fails outright. Failing outright is the right direction —
# a release that half-happened is worse than one that did not.
#
# THE CASK IS ON ITS LAST RELEASE. The tap's channel is now a FORMULA,
# `curiouspub`, written by the release workflow's formula job from this
# run's checksum file (tools/formula), and installable on macOS and Linux.
#
# A cask was chosen first because the release tool's formula block is
# deprecated and its own validator refuses a configuration that uses one.
# That is still true, and it is why the formula is not written here: the
# validator stays a gate. What a cask cost was Linux, where it does not
# install, and a post-install hook the package manager has since
# deprecated; a formula carries neither cost.
#
# This block stays until the formula's macOS binary is accepted by the
# operating system without any exemption, which is what the signing block
# above is for. It is removed in the release after the first one that
# passes that check, and not before: until then, this cask's post-install
# hook is the only Homebrew install on a Mac that runs without one.
homebrew_casks:
  - name: curious
    binaries: [curious]
    repository:
      owner: curiouspub
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    # Both of these are spelled for HOMEBREW'S linter rather than to
    # match the npm wrapper's copy, which keeps its own: a cask homepage
    # wants a slash after the domain, and a cask description must not end
    # in a full stop. `brew style` reports each as its own offence, and a
    # cask that lints dirty is a thing somebody else eventually opens a
    # pull request about — at the tap, where this file's output lands and
    # where a fix would be overwritten by the next release.
    homepage: https://curious.pub/
    description: Pack an Astro project, upload it, and stream the build
    license: MIT
    caveats: |
      This cask is deprecated and will be removed in a later release.
      Install the formula instead, which also works on Linux:
        brew uninstall --cask curious && brew install curiouspub/tap/curiouspub
      If the formula is already installed, it took over the curious
      command, and removing this cask takes the command away again.
      Remove the cask, then link the formula:
        brew uninstall --cask curious && brew link curiouspub/tap/curiouspub
    hooks:
      post:
        # An unsigned binary downloaded by the package manager is
        # quarantined by the operating system, and the first run then
        # fails in a way that reads as a broken download rather than as a
        # policy. The binaries are now signed and notarised, which is
        # the proper answer; this hook stays for as long as the cask
        # does, because it costs nothing and the cask is on its way out.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/curious"]
          end

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

release:
  draft: false
  prerelease: auto
