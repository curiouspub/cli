name: Release

# A VERSION TAG AND NOTHING ELSE. Every additional trigger is another way
# to reach the publishing job, and this job's whole purpose is to make an
# irreversible change to what strangers download. A manual dispatch would
# run against whatever branch the person chose; a branch push would run
# on work nobody tagged.
on:
  push:
    tags: ["v*"]

# The floor. A job that needs more says so itself, in the job, where the
# reason sits next to the grant — and every permission a job holds is one
# that everything running inside it holds too.
permissions:
  contents: read

jobs:
  # FIRST, AND EVERYTHING ELSE DEPENDS ON IT. A tag push does not run the
  # ordinary CI workflow at all, and a tag is the surface with the least
  # chance of a second look: a name a person typed under time pressure,
  # carrying a message they wrote in the same minute. Both are published
  # the instant this workflow starts.
  #
  # It holds no write permission and names no credential, like the job
  # below it.
  surfaces:
    name: the published surfaces that are not files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The range needs its own endpoints, and the checker proves
          # itself against a commit in this repository's history before it
          # examines any of them.
          #
          # AND A TAG PUSH IS THE NEW-REF CASE EVERY TIME: there is no
          # before-sha, so what the tag publishes is measured against the
          # default branch. The checkout action fetches only the pushed
          # ref unless the depth is unbounded, in which case it fetches
          # every head and tag — read at the pinned commit above rather
          # than remembered. Reduce this to a number and this job refuses
          # every release tag, correctly and unhelpfully.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      - name: make surface-check
        shell: bash
        run: make surface-check

  # THE PRECONDITION, and it is a separate job on purpose: it holds no
  # write permission and names no credential, so nothing it runs can
  # publish anything even if the check itself is wrong.
  #
  # A tag is a name a person types. It can point at any commit in the
  # repository, including one no review ever saw and one that was
  # rewritten out of the branch afterwards. Without this, the tag is the
  # only thing deciding what gets published.
  reachable:
    needs: surfaces
    name: the tag names a commit the default branch already carries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ancestry cannot be computed against history that was not
          # fetched. A shallow checkout makes the check below refuse
          # every tag, which fails closed and diagnoses nothing.
          fetch-depth: 0

      - name: refuse a tag that is not on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor \
                 "${GITHUB_SHA}" "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on"
            echo "::error::${DEFAULT_BRANCH}. A release is cut from reviewed work; move"
            echo "::error::the tag to a commit the default branch carries and push again."
            exit 1
          fi
          echo "${GITHUB_REF_NAME} -> ${GITHUB_SHA}, reachable from ${DEFAULT_BRANCH}."

  # THE PUBLISHING JOB. It runs in a deployment environment with a
  # required reviewer, and that is the only brake in front of the whole
  # outward mutation — binaries, checksums, a signature, a release, a tap
  # write. This repository's standing pattern is that a command which
  # changes real state prints what it is about to do and stops without an
  # explicit word; that pattern governs SCRIPTS, and pushing a tag is not
  # one. A wrapper is a brake anybody gets past by not using it. An
  # environment is server-side, it cannot be skipped, and it enumerates on
  # its own, because a pending deployment lists what is waiting.
  publish:
    name: build, sign and publish
    # Both named rather than relying on the chain through reachable. A
    # dependency that holds by transitivity holds until somebody edits the
    # middle of the chain, and the edit that removes it will not look like
    # it removed anything.
    needs: [surfaces, reachable]
    environment: release
    runs-on: ubuntu-latest
    permissions:
      # Only here, and only for the duration of an approved run.
      contents: write
      # The identity a keyless signature is made with. It says this
      # repository's release workflow produced the artefact, which is the
      # question a checksum cannot answer.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version stamped into the binary is derived from the tag
          # and the commit, and both need the history to be there.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A release must not depend on which day it was built. The
          # module states the toolchain; nothing else gets a vote.
          check-latest: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # An exact version, for the same reason the release tool has
          # one. NOTE for whoever maintains this: the scheduled update
          # policy bumps action REFERENCES and cannot see a version
          # passed as an input, so this pin is one a person has to move.
          # It is current as of the change that added it.
          cosign-release: v3.1.3

      # THE macOS SIGNING MATERIAL IS ALL PRESENT, OR NOTHING IS BUILT. A
      # secret that does not exist reaches a step as an empty string, not
      # as an error, and the release tool treats an empty notary value as
      # "sign but do not notarise" and says so only at info level. So a
      # release that lost one of these five would otherwise ship binaries
      # the operating system refuses, and report green. Checked here,
      # before the tool runs, so a missing one publishes nothing.
      #
      # It also records the moment just before the build, which is how the
      # log step below tells this run's notary submissions from earlier
      # ones.
      - name: the macOS signing material is all present
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          for name in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_KEY MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::the release environment is missing:$missing. Without them the macOS binaries ship unsigned or un-notarised, and the operating system refuses them. Nothing has been built or published."
            exit 1
          fi
          echo "NOTARY_SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # An exact version, never the newest. A release built from
          # whatever the tool happened to be that morning is a release
          # nobody can reproduce.
          version: v2.18.1
          args: release --clean
        env:
          # Minted for this job by the runner and bounded by the
          # permissions block above. It is never a repository secret.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Write access to the tap repository and nothing else. The job
          # token cannot reach another repository at all, and a token
          # that could reach every repository would hand this job far
          # more than a tap write.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # The developer certificate and the notary key. Read by the
          # release tool's signing block in .goreleaser.yaml, and by
          # nothing else in this run except the two steps beside this one.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

      # THE CHECKSUMS LEAVE THIS JOB AS A RUN ARTEFACT, and the wrapper job
      # below takes them from here rather than from the release. A release
      # asset can be replaced by anyone holding write access to the
      # repository, between this job ending and the next one starting; an
      # artefact of this run can only be written by this run. The table the
      # package ships is what every installer verifies a download against,
      # so its source is the one thing in the chain that must not be a
      # network read of something mutable.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums
          path: dist/checksums.txt
          if-no-files-found: error
          # The next job reads it within minutes. Nothing else ever should.
          retention-days: 1

      # THE NOTARY SERVICE'S OWN LOG, attached to the run. The release tool
      # fetches it only for a submission that failed; a passing one leaves
      # no record of what was checked. This step fetches one per binary.
      #
      # IT CANNOT FAIL THE JOB, and that is a choice with a cost stated
      # here. By this point the release is public; failing now would skip
      # the formula and the npm wrapper, which is a half-published release,
      # for the sake of a record. The gate on notarisation is the mac-check
      # job below, which asks the operating system directly. A failure
      # here shows as a failed step and an annotation, not as a red job.
      - name: attach the notary service's log
        continue-on-error: true
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: node scripts/notary-log.js notary-log

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: notary-log
          path: notary-log
          if-no-files-found: error

  # THE HOMEBREW FORMULA, WRITTEN HERE AND NOT BY THE RELEASE TOOL. The
  # tool's formula block is deprecated and its own validator refuses it,
  # and that validator is a gate this repository keeps green. So a small
  # program in this repository writes the formula from the checksum file
  # this run produced, and this job pushes it to the tap.
  #
  # THE CHECKSUMS COME FROM THIS RUN, as they do for the npm wrapper: the
  # publish job hands them over as an artefact, and nothing here reads the
  # release. Each platform's archive is pinned by the sha256 the release
  # itself computed.
  #
  # Reviewed like the other jobs that change something outside this
  # repository: it writes to the tap, and that is public the moment it
  # lands.
  formula:
    name: write the Homebrew formula
    needs: publish
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checksums
          path: dist

      - name: write the formula from this run's checksums
        run: >
          go run ./tools/formula
          -version "${GITHUB_REF_NAME#v}"
          -checksums dist/checksums.txt
          -download-base "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          -homepage "https://curious.pub/"
          -desc "Pack an Astro project, upload it, and stream the build"
          -out curiouspub.rb

      # The tap, checked out with the one credential that can write to it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: curiouspub/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: publish the formula to the tap
        run: |
          set -euo pipefail
          mkdir -p tap/Formula
          cp curiouspub.rb tap/Formula/curiouspub.rb
          cd tap
          git config user.name "curious release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/curiouspub.rb
          git commit -m "curiouspub ${GITHUB_REF_NAME}"
          git push

  # THE FORMULA INSTALLS ON LINUX, from a tap nobody added, and reports
  # the version this tag released. It installs what strangers install,
  # the way they install it, and publishes nothing and holds no
  # credential, so it needs no reviewer.
  #
  # IT FOLLOWS THE FORMULA JOB, NOT THE WHOLE RUN. It used to be a separate
  # workflow triggered by a successful Release run, and it was skipped on
  # both releases that trigger saw: each run concluded as a failure because
  # its package job went red, while the formula this check exists for had
  # shipped. A red in an unrelated job said nothing about the formula, and
  # the check never ran; both times it was dispatched by hand and passed.
  # So it depends on the formula job alone. always() is what lets it run
  # when another job in the run has failed, and the result test is what
  # stops it running when the formula job itself did not succeed. A
  # guard holds the condition to exactly that.
  brew-linux:
    name: the formula installs on Linux from a tap nobody added
    needs: formula
    if: always() && needs.formula.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The runner image carries the package manager but does not put it on
      # PATH. No tap is added first: `brew install owner/tap/name` taps on
      # its own, which is the path a stranger takes. The version the binary
      # reports is checked against the tag, and that check is what pins an
      # install that cannot name a version.
      - name: install the formula and check the version it reports
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install curiouspub/tap/curiouspub
          got="$(curious version)"
          echo "$got"
          case " $got " in
            *" $want "*) echo "installed $want, as released" ;;
            *) echo "::error::the formula installed '$got', and the release is $want"; exit 1 ;;
          esac

  # THE OPERATING SYSTEM IS ASKED WHETHER IT WOULD RUN THE macOS BINARY,
  # on a Mac, from the archive the release published. The failure this
  # exists for was invisible from every Linux runner: an unsigned binary
  # installs, links and reports its version, and is then killed on the
  # first Mac that has not exempted its terminal.
  #
  # scripts/gatekeeper-check.sh asks for the assessment a download gets,
  # and requires the source to be a notarised developer signature.
  # Accepted alone is not enough: only notarisation separates a release
  # from a binary somebody merely signed.
  #
  # Then the binary is marked as downloaded, as a browser or the package
  # manager would mark it, and run. That run only proves the version, not
  # the assessment: whether a hosted runner enforces the policy is the
  # runner's business, and the status line is printed so the log says
  # which it was.
  #
  # It follows the publish job only. It holds no credential and no
  # environment: the archives are public, read over plain HTTPS from the
  # release they belong to, and the checksum file beside them is checked
  # first.
  mac-check:
    name: the macOS binary is accepted by the operating system and runs
    needs: publish
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: assess the released darwin binaries and run one
        shell: bash
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          mkdir -p dl
          curl -fsSL -o dl/checksums.txt "$base/checksums.txt"
          for arch in amd64 arm64; do
            curl -fsSL -o "dl/curious_${want}_darwin_${arch}.tar.gz" "$base/curious_${want}_darwin_${arch}.tar.gz"
          done
          (cd dl && grep -E "  curious_${want}_darwin_(amd64|arm64)\.tar\.gz$" checksums.txt | shasum -a 256 -c -)
          for arch in amd64 arm64; do
            mkdir -p "dl/$arch"
            tar -xzf "dl/curious_${want}_darwin_${arch}.tar.gz" -C "dl/$arch"
          done
          spctl --status || true
          scripts/gatekeeper-check.sh dl/amd64/curious dl/arm64/curious
          xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");release-check;" dl/arm64/curious
          got="$(dl/arm64/curious version)"
          echo "$got"
          case " $got " in
            *" $want "*) echo "the notarised binary ran and reported $want, as released" ;;
            *) echo "::error::the macOS binary reported '$got', and the release is $want"; exit 1 ;;
          esac

  # THE WRAPPER PUBLISH, AND IT IS A SEPARATE JOB ON PURPOSE. Under
  # trusted publishing the identity token IS the registry credential, so
  # putting this step in the job above would place the ability to publish
  # a package inside a job that runs a full Go build and three actions
  # from outside the actions organisation. The split is what keeps the
  # least-privilege claim true rather than merely stated.
  #
  # ITS OWN ACTION LIST, written out rather than claimed to be empty:
  # actions/checkout, because the package files are in the tree;
  # actions/setup-node, because publishing needs a newer package manager
  # than the wrapper's own floor; and actions/download-artifact, because
  # the checksums arrive from the job above inside this run. All three
  # pinned, all three from the actions organisation.
  #
  # ONE FETCH IN A RUN STEP, PINNED AND VERIFIED, and this sentence used to
  # say there were none. The package manager a credential-free publish
  # needs is installed from the registry at an exact version, and the step
  # after it refuses anything but that version. An exact version on that
  # registry is immutable once published, so the bytes are fixed; the
  # range this line once named was resolved afresh on every release, inside
  # the job that holds the publish identity. Node is an exact version too,
  # and for the same reason: A JOB THAT HOLDS A CREDENTIAL RESOLVES
  # NOTHING FROM A RANGE.
  #
  # NO REGISTRY SECRET EXISTS. The job proves its identity with the token
  # the runner mints for it, so there is nothing here to leak, rotate or
  # scope wrongly.
  #
  # OPERATOR PRECONDITION, named as one: the trusted publisher is
  # configured on the registry against this repository, this workflow
  # file and this environment. A reviewed environment may prompt once per
  # job, so the first release is what says how many approvals a release
  # now takes.
  wrapper:
    name: publish the npm wrapper
    needs: publish
    environment: release
    runs-on: ubuntu-latest
    permissions:
      # WRITTEN IN FULL. A job-level block replaces the workflow floor
      # rather than adding to it, so "id-token and nothing else" would
      # literally mean no read access at all.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # THERE IS NO registry-url HERE, AND ITS ABSENCE IS A DECISION
      # RATHER THAN AN OMISSION. Given one, this action writes an .npmrc
      # holding //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} and
      # points the package manager at it through NPM_CONFIG_USERCONFIG.
      # No such token exists in this repository and none should: the
      # publish below proves who it is by exchanging this job's identity
      # token with the registry, which is the whole reason there is no
      # credential here to leak, rotate or scope wrongly.
      #
      # A configured auth entry defeats that. The package manager finds
      # what looks like a credential, takes that path, and never performs
      # the exchange — and what it reports is either "you need auth" or a
      # 404 on a package that plainly exists, neither of which names the
      # cause. WHERE IT FAILS is the sharp part: this job runs after the
      # tag is public and the release is already built and signed, so the
      # result is a published tag with binaries and no installable package
      # beside them.
      #
      # The line also bought nothing when it worked: this publishes to the
      # default registry, which is where the package manager already
      # looks.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # EXACT, NOT THE PACKAGE'S FLOOR. The floor is a range, and a
          # range resolves to whatever is newest on the morning of the
          # release, inside the job that holds the publish identity. This
          # is the Node the publish runs on, not the one a user installs
          # with; the package's own floor still says that, and the gate
          # tests both ends of it.
          node-version: 24.21.0

      # EXACT, AND CHECKED. A credential-free publish needs a package
      # manager of at least 11.5.1, which is newer than the one the Node
      # above bundles. It is installed at one exact version, never a
      # range: a range is resolved at run time, and this job holds the
      # identity the registry accepts as this package's publisher.
      - name: install the package manager this publish needs
        run: npm install -g npm@11.20.0

      # TWO DIFFERENT NUMBERS WITH TWO DIFFERENT REASONS. The package
      # declares the package manager a person installing it needs; this
      # is the one a credential-free publish needs, which is newer and is
      # nobody's business but this job's.
      - name: the package manager here is the one installed above
        run: |
          set -euo pipefail
          want=11.20.0
          have="$(npm --version)"
          if [ "$have" != "$want" ]; then
            echo "::error::this publish runs on npm ${want}, the version installed above; this runner has ${have}"
            exit 1
          fi
          echo "npm ${have}"

      # FROM THIS RUN, NEVER FROM THE RELEASE. The job above hands the file
      # over as an artefact of this run; this job makes no network read of
      # the release at all, so nothing that happens to a release asset
      # between the two jobs can reach the table the package ships.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checksums
          path: dist

      # The only thing that holds the tag, the package version and every
      # key of the shipped table to the same number.
      - name: build the checksum table the package ships
        run: |
          node npm/tools/build-checksums.js \
            --tag "${GITHUB_REF_NAME}" \
            --checksums dist/checksums.txt \
            --out npm/checksums.json

      - name: publish
        working-directory: npm
        run: npm publish --provenance --access public --tag latest

      # THE MEASUREMENT THAT REPLACES A GUESS. This name already carries
      # a published version higher than the one being released, and
      # whether a publish moves the newest pointer in that situation is
      # not written down anywhere. So it is not assumed: the registry is
      # asked, on every release, and a disagreement fails the job rather
      # than shipping a package nobody can install by name.
      #
      # IT POLLS, BECAUSE THE REGISTRY SAYS IT IS EVENTUAL. The publish
      # itself prints that the package "may take a few minutes to become
      # available", and a single read straight after it measures the
      # registry before it has finished. Two releases went red that way
      # over a correct publish: one read 2.3 seconds after, one 0.4
      # seconds after, and the registry settled on its own in 54 and
      # about 80 seconds. So it reads every 10 seconds for up to five
      # minutes. The window is a number chosen past the two observations,
      # not a measured bound, and the message at its end reports the
      # window rather than asserting a fault.
      #
      # EVERY READ IS A LIVE READ. The client answers from a local cache
      # unless told not to, and a cached answer looks exactly like a
      # fresh one at the call site.
      #
      # IT ENDS ONE OF THREE WAYS, and says which, because "the pointer is
      # wrong" and "the registry has not finished" need different people
      # to do different things:
      #   - the newest pointer names this version: pass, with the time it
      #     took;
      #   - the window ends and the registry still does not have this
      #     version at all: the registry did not finish, and nothing here
      #     is wrong yet;
      #   - the window ends, the version is there, and the pointer names
      #     another one: the original failure, and the only case where
      #     moving the pointer by hand is the repair.
      #
      # It cannot be two commands. The identity exchange happens inside
      # the publish and the credential it obtains lives in that process
      # only, so a second authenticated command in this job would have
      # nothing to authenticate with. None of these reads authenticates.
      - name: the registry agrees about which version is newest
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          node -e '
            const { execFileSync } = require("node:child_process");
            const [, wanted, intervalSeconds, windowSeconds, ...client] = process.argv;
            const interval = Number(intervalSeconds) * 1000;
            const window = Number(windowSeconds) * 1000;
