name: Release

# Only the established version-tag trigger can enter release staging.
on:
  push:
    tags: ["v*"]

# The floor. A job that needs more says so itself, in the job, where the
# reason sits next to the grant — and every permission a job holds is one
# that everything running inside it holds too.
permissions:
  contents: read

concurrency:
  group: cli-release
  cancel-in-progress: false

jobs:
  # FIRST, AND EVERYTHING ELSE DEPENDS ON IT. A tag push does not run the
  # ordinary CI workflow at all, and a tag is the surface with the least
  # chance of a second look: a name a person typed under time pressure,
  # carrying a message they wrote in the same minute. Both are published
  # the instant this workflow starts.
  #
  # It holds no write permission and names no credential, like the job
  # below it.
  surfaces:
    name: the published surfaces that are not files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The range needs its own endpoints, and the checker proves
          # itself against a commit in this repository's history before it
          # examines any of them.
          #
          # AND A TAG PUSH IS THE NEW-REF CASE EVERY TIME: there is no
          # before-sha, so what the tag publishes is measured against the
          # default branch. The checkout action fetches only the pushed
          # ref unless the depth is unbounded, in which case it fetches
          # every head and tag — read at the pinned commit above rather
          # than remembered. Reduce this to a number and this job refuses
          # every release tag, correctly and unhelpfully.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      - name: make surface-check
        shell: bash
        run: make surface-check

  # THE PRECONDITION, and it is a separate job on purpose: it holds no
  # write permission and names no credential, so nothing it runs can
  # publish anything even if the check itself is wrong.
  #
  # A tag is a name a person types. It can point at any commit in the
  # repository, including one no review ever saw and one that was
  # rewritten out of the branch afterwards. Without this, the tag is the
  # only thing deciding what gets published.
  reachable:
    needs: surfaces
    name: the tag names a commit the default branch already carries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ancestry cannot be computed against history that was not
          # fetched. A shallow checkout makes the check below refuse
          # every tag, which fails closed and diagnoses nothing.
          fetch-depth: 0

      - name: refuse a tag that is not on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor \
                 "${GITHUB_SHA}" "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on"
            echo "::error::${DEFAULT_BRANCH}. A release is cut from reviewed work; move"
            echo "::error::the tag to a commit the default branch carries and push again."
            exit 1
          fi
          echo "${GITHUB_REF_NAME} -> ${GITHUB_SHA}, reachable from ${DEFAULT_BRANCH}."

  # Build and assess the release with the existing tag-scoped Apple inputs.
  stage:
    needs: [surfaces, reachable]
    if: github.run_attempt == 1
    environment: release
    runs-on: macos-26
    permissions:
      checks: read
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      manifest-sha: ${{ steps.seal.outputs.manifest-sha }}
      tag-oid: ${{ steps.seal.outputs.tag-oid }}
      checksums-sha: ${{ steps.seal.outputs.checksums-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version stamped into the binary is derived from the tag
          # and the commit, and both need the history to be there.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A release must not depend on which day it was built. The
          # module states the toolchain; nothing else gets a vote.
          check-latest: false

      - name: Verify the approved source and required checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]
          test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$GITHUB_SHA"
          test "$(git cat-file -t "$GITHUB_REF")" = tag
          if [[ "$GITHUB_REF_NAME" == v0.1.8 ]]; then
            notes="$(git for-each-ref --format='%(contents)' "$GITHUB_REF")"
            if [[ -z "$notes" || "$notes" == "$GITHUB_REF_NAME" ]]; then
              echo "::error::The v0.1.8 tag must contain the reviewed release notes."
              exit 1
            fi
          fi
          path="repos/$GITHUB_REPOSITORY"
          gh api "$path/branches/main" | jq -e --arg sha "$GITHUB_SHA" '.protected and .commit.sha==$sha' >/dev/null
          gh api --paginate "$path/commits/$GITHUB_SHA/check-runs?per_page=100" |
            jq -es '
              [.[].check_runs[] | select(.app.id==15368 and .conclusion=="success") | .name] as $green |
              (["ci (macos-latest)", "ci (ubuntu-latest)", "ci (windows-latest)",
                "the wrapper package, on the Node floor and on current (22)",
                "the wrapper package, on the Node floor and on current (current)",
                "the published surfaces that are not files",
                "build every artefact and publish none of them"] - $green | length)==0
            ' >/dev/null

      # THE macOS SIGNING MATERIAL IS ALL PRESENT, OR NOTHING IS BUILT. A
      # secret that does not exist reaches a step as an empty string, not
      # as an error, and the release tool treats an empty notary value as
      # "sign but do not notarise" and says so only at info level. So a
      # release that lost one of these five would otherwise ship binaries
      # the operating system refuses, and report green. Checked here,
      # before the tool runs, so a missing one publishes nothing.
      #
      # It also records the moment just before the build, which is how the
      # log step below tells this run's notary submissions from earlier
      # ones.
      - name: the macOS signing material is all present
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          for name in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_KEY MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::the release environment is missing:$missing. Without them the macOS binaries ship unsigned or un-notarised, and the operating system refuses them. Nothing has been built or published."
            exit 1
          fi
          echo "NOTARY_SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # An exact version, never the newest. A release built from
          # whatever the tool happened to be that morning is a release
          # nobody can reproduce.
          version: v2.18.1
          args: release --clean --skip=publish,sign
        env:
          # Minted for this job by the runner and bounded by the
          # permissions block above. It is never a repository secret.
          GITHUB_TOKEN: ${{ github.token }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

      - name: Check Developer ID, timestamp, notarization and quarantine
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          test "$(uname -m)" = arm64
          spctl --status | grep -qx 'assessments enabled'
          (cd dist && shasum -a 256 -c checksums.txt)
          quarantine="0081;$(printf '%x' "$(date +%s)");release-check;"
          mkdir -p dl/amd64 dl/arm64
          for arch in amd64 arm64; do
            base="curious_${want}_darwin_${arch}"
            archive="dist/$base.tar.gz"
            bin="dl/$arch/curious"
            xattr -w com.apple.quarantine "$quarantine" "$archive"
            tar -xzf "$archive" -C "dl/$arch"
            gzip -dc "dist/$base.gz" | cmp - "$bin"
            xattr -w com.apple.quarantine "$quarantine" "$bin"
            test "$(xattr -p com.apple.quarantine "$bin")" = "$quarantine"
            codesign --verify --strict "$bin"
            details="$(codesign -dv --verbose=4 "$bin" 2>&1)"
            grep -qx 'TeamIdentifier=B2JK8DNDHD' <<< "$details"
            grep -q '^Authority=Developer ID Application:' <<< "$details"
            grep -Eq 'flags=.*\([^)]*runtime[^)]*\)' <<< "$details"
            grep -q '^Timestamp=' <<< "$details"
            codesign -d --extract-certificates="dl/$arch/cert-" "$bin" 2>/dev/null
            printf '%s  dl/%s/cert-0\n' fdcaaf6a1252359ffbdfc241f75654340290f055c5a0c53ad66d8f14844bea9f "$arch" | shasum -a 256 -c -
            sed -n 's/^CDHash=//p' <<< "$details" > "dl/$arch/cdhash"
          done
          scripts/gatekeeper-check.sh dl/amd64/curious dl/arm64/curious
          got="$(dl/arm64/curious version)"
          case "$got" in "curious $want (commit $GITHUB_SHA, "*) ;; *) exit 1 ;; esac
          test "$(xattr -p com.apple.quarantine dl/arm64/curious)" = "$quarantine"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Record the accepted notary submissions
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: node scripts/notary-log.js notary-log

      - name: Seal the exact GitHub, Homebrew and npm candidates
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          mkdir sealed
          files=()
          for os in darwin linux windows; do
            for arch in amd64 arm64; do
              ext=tar.gz
              if [[ "$os" == windows ]]; then ext=zip; fi
              files+=("curious_${want}_${os}_${arch}.gz" "curious_${want}_${os}_${arch}.$ext")
            done
          done
          (cd dist && cp "${files[@]}" checksums.txt ../sealed/)
          for file in "${files[@]}"; do
            test "$(grep -Ec "^[0-9a-f]{64}  ${file//./[.]}$" sealed/checksums.txt)" = 1
          done
          test "$(wc -l < sealed/checksums.txt | tr -d ' ')" = 12
          (cd sealed && shasum -a 256 -c checksums.txt)
          node npm/tools/build-checksums.js --tag "$GITHUB_REF_NAME" --checksums sealed/checksums.txt --out npm/checksums.json
          npm install -g npm@11.20.0
          test "$(npm --version)" = 11.20.0
          (cd npm && npm pack --ignore-scripts --pack-destination ../sealed)
          test -f "sealed/curiouspub-$want.tgz"
          go run ./tools/formula -version "$want" -checksums sealed/checksums.txt \
            -download-base "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" \
            -homepage https://curious.pub/ -desc 'Pack an Astro project, upload it, and stream the build' \
            -out sealed/curiouspub.rb
          notes="$(git for-each-ref --format='%(contents)' "$GITHUB_REF")"
          if [[ -z "$notes" || "$notes" == "$GITHUB_REF_NAME" ]]; then
            cp dist/CHANGELOG.md sealed/release-notes.md
          else
            git cat-file tag "$GITHUB_REF" | sed '1,/^$/d' > sealed/release-notes.md
          fi
          test -s sealed/release-notes.md
          for arch in amd64 arm64; do
            cdhash="$(cat "dl/$arch/cdhash")"
            [[ "$cdhash" =~ ^[0-9a-f]{40}$ ]]
            apple_arch="$arch"
            if [[ "$arch" == amd64 ]]; then apple_arch=x86_64; fi
            jq -es --arg hash "$cdhash" --arg arch "$apple_arch" '
              map(select(.status=="Accepted" and
                any(.ticketContents[]?; .cdhash==$hash and .arch==$arch and .digestAlgorithm=="SHA-256"))) |
              if length==1 then .[0] | {status,jobId,sha256,ticketContents}
              else error("unmatched notary submission") end
            ' notary-log/*.json > "sealed/notary-$arch.json"
          done
          oid="$(git rev-parse "$GITHUB_REF")"
          printf '%s\n' "$GITHUB_SHA" "$GITHUB_REF" "$oid" "$GITHUB_RUN_ID" > sealed/source.txt
          (cd sealed && shasum -a 256 -- * > MANIFEST.sha256)
          digest="$(shasum -a 256 sealed/MANIFEST.sha256 | awk '{print $1}')"
          sums="$(shasum -a 256 sealed/checksums.txt | awk '{print $1}')"
          printf 'manifest-sha=%s\ntag-oid=%s\nchecksums-sha=%s\n' "$digest" "$oid" "$sums" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: candidate
          path: sealed/
          if-no-files-found: error
          overwrite: false
          retention-days: 30

      - name: Show the exact candidate for owner review
        env:
          DIGEST: ${{ steps.seal.outputs.manifest-sha }}
          ID: ${{ steps.upload.outputs.artifact-id }}
          ZIP_SHA: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          printf 'Candidate run %s / artifact %s / archive SHA-256 %s / manifest SHA-256 %s\n\n' \
            "$GITHUB_RUN_ID" "$ID" "$ZIP_SHA" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          cat sealed/source.txt sealed/MANIFEST.sha256 >> "$GITHUB_STEP_SUMMARY"

  receipt:
    name: Approve candidate and sign its checksum receipt
    needs: stage
    environment: release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.receipt.outputs.digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.stage.outputs.artifact-id }}
          path: staged
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Mint the detached receipt once across attempts
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED: ${{ vars.RELEASE_APPROVED_STAGE }}
          STAGE_ID: ${{ needs.stage.outputs.artifact-id }}
          MANIFEST_SHA: ${{ needs.stage.outputs.manifest-sha }}
        run: |
          set -euo pipefail
          [[ "$MANIFEST_SHA" =~ ^[0-9a-f]{64}$ ]]
          (cd staged && printf '%s  MANIFEST.sha256\n' "$MANIFEST_SHA" | sha256sum -c - && sha256sum -c MANIFEST.sha256)
          [[ "$STAGE_ID" =~ ^[1-9][0-9]*$ ]]
          test "$APPROVED" = "$GITHUB_RUN_ID:$STAGE_ID:$MANIFEST_SHA"
          test "$(sed -n '1p' staged/source.txt)" = "$GITHUB_SHA"
          test "$(sed -n '2p' staged/source.txt)" = "$GITHUB_REF"
          test "$(sed -n '4p' staged/source.txt)" = "$GITHUB_RUN_ID"
          path="repos/$GITHUB_REPOSITORY"
          tag_oid="$(sed -n '3p' staged/source.txt)"
          gh api "$path/git/ref/tags/$GITHUB_REF_NAME" | jq -e --arg oid "$tag_oid" '.object.type=="tag" and .object.sha==$oid' >/dev/null
          gh api "$path/git/tags/$tag_oid" | jq -e --arg sha "$GITHUB_SHA" '.object.type=="commit" and .object.sha==$sha' >/dev/null
          matches="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=tag-checksum-receipt" |
            jq -s '[.[].artifacts[] | select(.name=="tag-checksum-receipt")]')"
          case "$(jq length <<< "$matches")" in
            0)
              if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
                echo "::error::No original receipt is retained. Stop for owner review; all channels remain gated."
                exit 1
              fi
              cosign sign-blob --yes --bundle=checksums.txt.bundle staged/checksums.txt
              echo 'created=true' >> "$GITHUB_OUTPUT"
              ;;
            1)
              id="$(jq -er '.[] | select(.expired==false) | .id' <<< "$matches")"
              digest="$(jq -er '.[] | .digest | select(test("^sha256:[a-f0-9]{64}$")) | ltrimstr("sha256:")' <<< "$matches")"
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > receipt.zip
              printf '%s  receipt.zip\n' "$digest" | sha256sum -c -
              test "$(unzip -Z -1 receipt.zip)" = checksums.txt.bundle
              mkdir -p previous
              unzip -p receipt.zip checksums.txt.bundle > previous/bundle
              mv previous/bundle checksums.txt.bundle
              ;;
            *) exit 1 ;;
          esac
          cosign verify-blob --bundle checksums.txt.bundle \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com staged/checksums.txt
          printf 'digest=%s\n' "$(sha256sum checksums.txt.bundle | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.receipt.outputs.created == 'true'
        with:
          name: tag-checksum-receipt
          path: checksums.txt.bundle
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  publish:
    needs: [stage, receipt]
    environment: release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.stage.outputs.artifact-id }}
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          name: tag-checksum-receipt
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Promote exact assets and verify GitHub readback
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RECEIPT_SHA: ${{ needs.receipt.outputs.digest }}
          MANIFEST_SHA: ${{ needs.stage.outputs.manifest-sha }}
          TAG_OID: ${{ needs.stage.outputs.tag-oid }}
        run: |
          set -euo pipefail
          test "$(sed -n '1p' dist/source.txt)" = "$GITHUB_SHA"
          test "$(sed -n '2p' dist/source.txt)" = "$GITHUB_REF"
          [[ "$RECEIPT_SHA" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  dist/checksums.txt.bundle\n' "$RECEIPT_SHA" | sha256sum -c -
          [[ "$MANIFEST_SHA" =~ ^[0-9a-f]{64}$ ]]
          (cd dist && printf '%s  MANIFEST.sha256\n' "$MANIFEST_SHA" | sha256sum -c - && sha256sum -c MANIFEST.sha256)
          cosign verify-blob --bundle dist/checksums.txt.bundle \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com dist/checksums.txt
          path="repos/$GITHUB_REPOSITORY"
          check_tag() {
            [[ "$TAG_OID" =~ ^[0-9a-f]{40}$ ]]
            gh api "$path/git/ref/tags/$GITHUB_REF_NAME" | jq -e --arg oid "$TAG_OID" '.object.type=="tag" and .object.sha==$oid' >/dev/null
            gh api "$path/git/tags/$TAG_OID" | jq -e --arg source "$GITHUB_SHA" --arg tag "$GITHUB_REF_NAME" '
              .tag==$tag and .object.type=="commit" and .object.sha==$source
            ' >/dev/null
          }
          check_tag
          releases="$(gh api --paginate "$path/releases" | jq -s --arg tag "$GITHUB_REF_NAME" 'add | map(select(.tag_name==$tag))')"
          prerelease=false
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=true; fi
          case "$(jq length <<< "$releases")" in
            0) gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file dist/release-notes.md "--prerelease=$prerelease" ;;
            1) : ;;
            *) exit 1 ;;
          esac
          release="$(gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease,tagName,name,body,assets)"
          jq -e --arg tag "$GITHUB_REF_NAME" --argjson prerelease "$prerelease" --rawfile notes dist/release-notes.md '
            .tagName==$tag and .name==$tag and .isPrerelease==$prerelease and
            (.body | sub("[\r\n]+$";""))==($notes | sub("[\r\n]+$";""))' <<< "$release" >/dev/null
          files=(dist/curious_"${GITHUB_REF_NAME#v}"_* dist/checksums.txt dist/checksums.txt.bundle)
          test "${#files[@]}" -eq 14
          require_assets() {
            python3 - "$1" "${files[@]}" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          release = json.loads(sys.argv[1])
          expected = {p.name: "sha256:" + hashlib.sha256(p.read_bytes()).hexdigest() for p in map(Path, sys.argv[2:])}
          for asset in release["assets"]:
              if asset["name"] not in expected or expected.pop(asset["name"]) != asset.get("digest"):
                  raise SystemExit("Conflicting or duplicate GitHub release asset")
          if expected and not release["isDraft"]:
              raise SystemExit("Public GitHub release is missing approved assets")
          PY
          }
          require_assets "$release"
          for file in "${files[@]}"; do
            if ! jq -e --arg name "${file##*/}" '.assets|any(.name==$name)' <<< "$release" >/dev/null; then
              gh release upload "$GITHUB_REF_NAME" "$file"
            fi
          done
          release="$(gh release view "$GITHUB_REF_NAME" --json isDraft,assets)"
          require_assets "$release"
          test "$(jq '.assets | length' <<< "$release")" -eq "${#files[@]}"
          if jq -e .isDraft <<< "$release" >/dev/null; then
            check_tag
            gh release edit "$GITHUB_REF_NAME" --draft=false
          fi
          release="$(gh release view "$GITHUB_REF_NAME" --json isDraft,assets)"
          jq -e '.isDraft==false' <<< "$release" >/dev/null
          require_assets "$release"
          # The owner verifies this repository setting before authorizing the run.
          # Stop downstream channels if the release is mutable for any reason.
          gh api "$path/releases/tags/$GITHUB_REF_NAME" | jq -e '.immutable==true' >/dev/null
          check_tag
          mkdir readback
          for file in "${files[@]}"; do
            gh release download "$GITHUB_REF_NAME" --pattern "${file##*/}" --dir readback
            cmp "$file" "readback/${file##*/}"
          done

  formula:
    needs: [stage, publish, mac-check]
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.stage.outputs.artifact-id }}
          path: staged
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: curiouspub/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Publish the exact formula and read back the tap
        env:
          MANIFEST_SHA: ${{ needs.stage.outputs.manifest-sha }}
          APPROVED_TAP_HEAD: ${{ vars.RELEASE_APPROVED_TAP_HEAD }}
        run: |
          set -euo pipefail
          [[ "$MANIFEST_SHA" =~ ^[0-9a-f]{64}$ && "$APPROVED_TAP_HEAD" =~ ^[0-9a-f]{40}$ ]]
          (cd staged && printf '%s  MANIFEST.sha256\n' "$MANIFEST_SHA" | sha256sum -c - && sha256sum -c MANIFEST.sha256)
          expected="$PWD/staged/curiouspub.rb"
          cd tap
          target=Formula/curiouspub.rb
          if ! cmp -s "$expected" "$target" || [[ -e Casks/curious.rb ]]; then
            test "$(git rev-parse HEAD)" = "$APPROVED_TAP_HEAD"
            mkdir -p Formula
            cp "$expected" "$target"
            git rm --quiet --ignore-unmatch Casks/curious.rb
            git add "$target"
            git -c user.name='curious release' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "curiouspub $GITHUB_REF_NAME"
            git push origin HEAD:refs/heads/main
          fi
          git fetch origin refs/heads/main
          git show "FETCH_HEAD:$target" | cmp - "$expected"
          if git cat-file -e FETCH_HEAD:Casks/curious.rb 2>/dev/null; then
            exit 1
          fi

  # THE FORMULA INSTALLS ON LINUX, from a tap nobody added, and reports
  # the version this tag released. It installs what strangers install,
  # the way they install it, and publishes nothing and holds no
  # credential, so it needs no reviewer.
  #
  # IT FOLLOWS THE FORMULA JOB, NOT THE WHOLE RUN. It used to be a separate
  # workflow triggered by a successful Release run, and it was skipped on
  # both releases that trigger saw: each run concluded as a failure because
  # its package job went red, while the formula this check exists for had
  # shipped. A red in an unrelated job said nothing about the formula, and
  # the check never ran; both times it was dispatched by hand and passed.
  # So it depends on the formula job alone. always() is what lets it run
  # when another job in the run has failed, and the result test is what
  # stops it running when the formula job itself did not succeed. A
  # guard holds the condition to exactly that.
  brew-linux:
    name: the formula installs on Linux from a tap nobody added
    needs: formula
    if: always() && needs.formula.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The runner image carries the package manager but does not put it on
      # PATH. No tap is added first: `brew install owner/tap/name` taps on
      # its own, which is the path a stranger takes. The version the binary
      # reports is checked against the tag, and that check is what pins an
      # install that cannot name a version.
      - name: install the formula and check the version it reports
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install curiouspub/tap/curiouspub
          got="$(curious version)"
          echo "$got"
          case " $got " in
            *" $want "*) echo "installed $want, as released" ;;
            *) echo "::error::the formula installed '$got', and the release is $want"; exit 1 ;;
          esac

  # THE OPERATING SYSTEM IS ASKED WHETHER IT WOULD RUN THE macOS BINARY,
  # on a Mac, from the archive the release published. The failure this
  # exists for was invisible from every Linux runner: an unsigned binary
  # installs, links and reports its version, and is then killed on the
  # first Mac that has not exempted its terminal.
  #
  # scripts/gatekeeper-check.sh asks for the assessment a download gets,
  # and requires the source to be a notarised developer signature.
  # Accepted alone is not enough: only notarisation separates a release
  # from a binary somebody merely signed.
  #
  # Then the binary is marked as downloaded, as a browser or the package
  # manager would mark it, and run. That run only proves the version, not
  # the assessment: whether a hosted runner enforces the policy is the
  # runner's business, and the status line is printed so the log says
  # which it was.
  #
  # It follows the publish job only. It holds no credential and no
  # environment: the archives are public, read over plain HTTPS from the
  # release they belong to, and the checksum file beside them is checked
  # first.
  mac-check:
    name: the macOS binary is accepted by the operating system and runs
    needs: [stage, publish]
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: assess the released darwin binaries and run one
        env:
          CHECKSUMS_SHA: ${{ needs.stage.outputs.checksums-sha }}
        shell: bash
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          mkdir -p dl
          curl -fsSL -o dl/checksums.txt "$base/checksums.txt"
          [[ "$CHECKSUMS_SHA" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  dl/checksums.txt\n' "$CHECKSUMS_SHA" | shasum -a 256 -c -
          for arch in amd64 arm64; do
            curl -fsSL -o "dl/curious_${want}_darwin_${arch}.tar.gz" "$base/curious_${want}_darwin_${arch}.tar.gz"
          done
          (cd dl && grep -E "  curious_${want}_darwin_(amd64|arm64)\.tar\.gz$" checksums.txt | shasum -a 256 -c -)
          for arch in amd64 arm64; do
            mkdir -p "dl/$arch"
            tar -xzf "dl/curious_${want}_darwin_${arch}.tar.gz" -C "dl/$arch"
          done
          spctl --status || true
          xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");release-check;" dl/arm64/curious
          scripts/gatekeeper-check.sh dl/amd64/curious dl/arm64/curious
          got="$(dl/arm64/curious version)"
          echo "$got"
          case " $got " in
            *" $want "*) echo "the notarised binary ran and reported $want, as released" ;;
            *) echo "::error::the macOS binary reported '$got', and the release is $want"; exit 1 ;;
          esac

  wrapper:
    name: publish the npm wrapper
    needs: [stage, publish, mac-check, formula, brew-linux]
    environment: release
    runs-on: ubuntu-latest
    permissions:
      # WRITTEN IN FULL. A job-level block replaces the workflow floor
      # rather than adding to it, so "id-token and nothing else" would
      # literally mean no read access at all.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # THERE IS NO registry-url HERE, AND ITS ABSENCE IS A DECISION
      # RATHER THAN AN OMISSION. Given one, this action writes an .npmrc
      # holding //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} and
      # points the package manager at it through NPM_CONFIG_USERCONFIG.
      # No such token exists in this repository and none should: the
      # publish below proves who it is by exchanging this job's identity
      # token with the registry, which is the whole reason there is no
      # credential here to leak, rotate or scope wrongly.
      #
      # A configured auth entry defeats that. The package manager finds
      # what looks like a credential, takes that path, and never performs
      # the exchange — and what it reports is either "you need auth" or a
      # 404 on a package that plainly exists, neither of which names the
      # cause. WHERE IT FAILS is the sharp part: this job runs after the
      # tag is public and the release is already built and signed, so the
      # result is a published tag with binaries and no installable package
      # beside them.
      #
      # The line also bought nothing when it worked: this publishes to the
      # default registry, which is where the package manager already
      # looks.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # EXACT, NOT THE PACKAGE'S FLOOR. The floor is a range, and a
          # range resolves to whatever is newest on the morning of the
          # release, inside the job that holds the publish identity. This
          # is the Node the publish runs on, not the one a user installs
          # with; the package's own floor still says that, and the gate
          # tests both ends of it.
          node-version: 24.21.0

      # EXACT, AND CHECKED. A credential-free publish needs a package
      # manager of at least 11.5.1, which is newer than the one the Node
      # above bundles. It is installed at one exact version, never a
      # range: a range is resolved at run time, and this job holds the
      # identity the registry accepts as this package's publisher.
      - name: install the package manager this publish needs
        run: npm install -g npm@11.20.0

      # TWO DIFFERENT NUMBERS WITH TWO DIFFERENT REASONS. The package
      # declares the package manager a person installing it needs; this
      # is the one a credential-free publish needs, which is newer and is
      # nobody's business but this job's.
      - name: the package manager here is the one installed above
        run: |
          set -euo pipefail
          want=11.20.0
          have="$(npm --version)"
          if [ "$have" != "$want" ]; then
            echo "::error::this publish runs on npm ${want}, the version installed above; this runner has ${have}"
            exit 1
          fi
          echo "npm ${have}"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.stage.outputs.artifact-id }}
          digest-mismatch: error
          path: staged

      - name: Publish the approved tarball without repacking
        env:
          MANIFEST_SHA: ${{ needs.stage.outputs.manifest-sha }}
        run: |
          set -euo pipefail
          [[ "$MANIFEST_SHA" =~ ^[0-9a-f]{64}$ ]]
          (cd staged && printf '%s  MANIFEST.sha256\n' "$MANIFEST_SHA" | sha256sum -c - && sha256sum -c MANIFEST.sha256)
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p 'require("./npm/package.json").version')" = "$version"
          package="staged/curiouspub-$version.tgz"
          integrity="sha512-$(openssl dgst -sha512 -binary "$package" | openssl base64 -A)"
          if npm view "curiouspub@$version" dist.integrity --json --prefer-online > registry.json; then
            jq -e --arg integrity "$integrity" '. == $integrity' registry.json >/dev/null
          else
            jq -e '.error.code=="E404"' registry.json >/dev/null
            npm publish --provenance --access public --tag latest "$package"
          fi
          found=false
          for ((try=0; try<30; try++)); do
            if result="$(npm view "curiouspub@$version" dist.integrity --json --prefer-online)" && [[ -n "$result" ]]; then
              jq -e --arg integrity "$integrity" '. == $integrity' <<< "$result" >/dev/null
              found=true
              break
            fi
            sleep 10
          done
          test "$found" = true
          npm view "curiouspub@$version" dist.attestations --json --prefer-online |
            jq -e '.provenance.predicateType=="https://slsa.dev/provenance/v1"' >/dev/null

      # THE MEASUREMENT THAT REPLACES A GUESS. This name already carries
      # a published version higher than the one being released, and
      # whether a publish moves the newest pointer in that situation is
      # not written down anywhere. So it is not assumed: the registry is
      # asked, on every release, and a disagreement fails the job rather
      # than shipping a package nobody can install by name.
      #
      # IT POLLS, BECAUSE THE REGISTRY SAYS IT IS EVENTUAL. The publish
      # itself prints that the package "may take a few minutes to become
      # available", and a single read straight after it measures the
      # registry before it has finished. Two releases went red that way
      # over a correct publish: one read 2.3 seconds after, one 0.4
      # seconds after, and the registry settled on its own in 54 and
      # about 80 seconds. So it reads every 10 seconds for up to five
      # minutes. The window is a number chosen past the two observations,
      # not a measured bound, and the message at its end reports the
      # window rather than asserting a fault.
      #
      # EVERY READ IS A LIVE READ. The client answers from a local cache
      # unless told not to, and a cached answer looks exactly like a
      # fresh one at the call site.
      #
      # IT ENDS ONE OF THREE WAYS, and says which, because "the pointer is
      # wrong" and "the registry has not finished" need different people
      # to do different things:
      #   - the newest pointer names this version: pass, with the time it
      #     took;
      #   - the window ends and the registry still does not have this
      #     version at all: the registry did not finish, and nothing here
      #     is wrong yet;
      #   - the window ends, the version is there, and the pointer names
      #     another one: the original failure, and the only case where
      #     moving the pointer by hand is the repair.
      #
      # It cannot be two commands. The identity exchange happens inside
      # the publish and the credential it obtains lives in that process
      # only, so a second authenticated command in this job would have
      # nothing to authenticate with. None of these reads authenticates.
      - name: the registry agrees about which version is newest
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # shellcheck disable=SC2016
          node -e '
            const { execFileSync } = require("node:child_process");
            const [, wanted, intervalSeconds, windowSeconds, ...client] = process.argv;
            const interval = Number(intervalSeconds) * 1000;
            const window = Number(windowSeconds) * 1000;
            const read = (args) => execFileSync(client[0], [...client.slice(1), ...args],
              { encoding: "utf8", stdio: ["ignore", "pipe", "pipe"] });
            const sleep = (ms) => new Promise((done) => setTimeout(done, ms));
            (async () => {
              const started = Date.now();
              let last = "nothing yet";
              for (;;) {
                try {
                  const tags = JSON.parse(read(["view", "--prefer-online", "curiouspub", "dist-tags", "--json"]));
                  last = String(tags.latest);
                  if (tags.latest === wanted) {
                    const took = ((Date.now() - started) / 1000).toFixed(1);
                    console.log(`the newest published version is ${wanted}, read ${took}s after the publish`);
                    return;
                  }
                } catch (err) {
                  last = `a failed read: ${String(err.message).split("\n")[0]}`;
                }
                if (Date.now() - started >= window) {
                  break;
                }
                console.log(`the registry answers ${last}; reading again in ${intervalSeconds}s`);
                await sleep(interval);
              }
              let present = false;
              try {
                present = read(["view", "--prefer-online", `curiouspub@${wanted}`, "version"]).trim() === wanted;
              } catch (err) {
                present = false;
              }
              if (present) {
                console.error(`::error::the registry has ${wanted}, and its newest pointer names ${last}. ` +
                  `Move it by hand with one interactive login and npm dist-tag add.`);
              } else {
                console.error(`::error::the registry did not finish publishing ${wanted} within ${windowSeconds}s; ` +
                  `its newest pointer still answers ${last}. Nothing is known to be wrong yet: ` +
                  `read it again before moving anything.`);
              }
              process.exit(1);
            })();
          ' "${version}" 10 300 npm
