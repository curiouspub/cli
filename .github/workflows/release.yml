name: Release

# A VERSION TAG AND NOTHING ELSE. Every additional trigger is another way
# to reach the publishing job, and this job's whole purpose is to make an
# irreversible change to what strangers download. A manual dispatch would
# run against whatever branch the person chose; a branch push would run
# on work nobody tagged.
on:
  push:
    tags: ["v*"]

# The floor. A job that needs more says so itself, in the job, where the
# reason sits next to the grant — and every permission a job holds is one
# that everything running inside it holds too.
permissions:
  contents: read

jobs:
  # FIRST, AND EVERYTHING ELSE DEPENDS ON IT. A tag push does not run the
  # ordinary CI workflow at all, and a tag is the surface with the least
  # chance of a second look: a name a person typed under time pressure,
  # carrying a message they wrote in the same minute. Both are published
  # the instant this workflow starts.
  #
  # It holds no write permission and names no credential, like the job
  # below it.
  surfaces:
    name: the published surfaces that are not files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The range needs its own endpoints, and the checker proves
          # itself against a commit in this repository's history before it
          # examines any of them.
          #
          # AND A TAG PUSH IS THE NEW-REF CASE EVERY TIME: there is no
          # before-sha, so what the tag publishes is measured against the
          # default branch. The checkout action fetches only the pushed
          # ref unless the depth is unbounded, in which case it fetches
          # every head and tag — read at the pinned commit above rather
          # than remembered. Reduce this to a number and this job refuses
          # every release tag, correctly and unhelpfully.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      - name: make surface-check
        shell: bash
        run: make surface-check

  # THE PRECONDITION, and it is a separate job on purpose: it holds no
  # write permission and names no credential, so nothing it runs can
  # publish anything even if the check itself is wrong.
  #
  # A tag is a name a person types. It can point at any commit in the
  # repository, including one no review ever saw and one that was
  # rewritten out of the branch afterwards. Without this, the tag is the
  # only thing deciding what gets published.
  reachable:
    needs: surfaces
    name: the tag names a commit the default branch already carries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ancestry cannot be computed against history that was not
          # fetched. A shallow checkout makes the check below refuse
          # every tag, which fails closed and diagnoses nothing.
          fetch-depth: 0

      - name: refuse a tag that is not on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor \
                 "${GITHUB_SHA}" "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on"
            echo "::error::${DEFAULT_BRANCH}. A release is cut from reviewed work; move"
            echo "::error::the tag to a commit the default branch carries and push again."
            exit 1
          fi
          echo "${GITHUB_REF_NAME} -> ${GITHUB_SHA}, reachable from ${DEFAULT_BRANCH}."

  # THE PUBLISHING JOB. It runs in a deployment environment with a
  # required reviewer, and that is the only brake in front of the whole
  # outward mutation — binaries, checksums, a signature, a release, a tap
  # write. This repository's standing pattern is that a command which
  # changes real state prints what it is about to do and stops without an
  # explicit word; that pattern governs SCRIPTS, and pushing a tag is not
  # one. A wrapper is a brake anybody gets past by not using it. An
  # environment is server-side, it cannot be skipped, and it enumerates on
  # its own, because a pending deployment lists what is waiting.
  publish:
    name: build, sign and publish
    # Both named rather than relying on the chain through reachable. A
    # dependency that holds by transitivity holds until somebody edits the
    # middle of the chain, and the edit that removes it will not look like
    # it removed anything.
    needs: [surfaces, reachable]
    environment: release
    runs-on: ubuntu-latest
    permissions:
      # Only here, and only for the duration of an approved run.
      contents: write
      # The identity a keyless signature is made with. It says this
      # repository's release workflow produced the artefact, which is the
      # question a checksum cannot answer.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version stamped into the binary is derived from the tag
          # and the commit, and both need the history to be there.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A release must not depend on which day it was built. The
          # module states the toolchain; nothing else gets a vote.
          check-latest: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # An exact version, for the same reason the release tool has
          # one. NOTE for whoever maintains this: the scheduled update
          # policy bumps action REFERENCES and cannot see a version
          # passed as an input, so this pin is one a person has to move.
          # It is current as of the change that added it.
          cosign-release: v3.1.3

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # An exact version, never the newest. A release built from
          # whatever the tool happened to be that morning is a release
          # nobody can reproduce.
          version: v2.18.1
          args: release --clean
        env:
          # Minted for this job by the runner and bounded by the
          # permissions block above. It is never a repository secret.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Write access to the tap repository and nothing else. The job
          # token cannot reach another repository at all, and a token
          # that could reach every repository would hand this job far
          # more than a tap write.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # THE WRAPPER PUBLISH, AND IT IS A SEPARATE JOB ON PURPOSE. Under
  # trusted publishing the identity token IS the registry credential, so
  # putting this step in the job above would place the ability to publish
  # a package inside a job that runs a full Go build and three actions
  # from outside the actions organisation. The split is what keeps the
  # least-privilege claim true rather than merely stated.
  #
  # ITS OWN ACTION LIST, written out rather than claimed to be empty:
  # actions/checkout, because the package files are in the tree, and
  # actions/setup-node, because publishing needs a newer package manager
  # than the wrapper's own floor. Both pinned, both from the actions
  # organisation, and no code fetched at run time.
  #
  # NO REGISTRY SECRET EXISTS. The job proves its identity with the token
  # the runner mints for it, so there is nothing here to leak, rotate or
  # scope wrongly.
  #
  # OPERATOR PRECONDITION, named as one: the trusted publisher is
  # configured on the registry against this repository, this workflow
  # file and this environment. A reviewed environment may prompt once per
  # job, so the first release is what says how many approvals a release
  # now takes.
  wrapper:
    name: publish the npm wrapper
    needs: publish
    environment: release
    runs-on: ubuntu-latest
    permissions:
      # WRITTEN IN FULL. A job-level block replaces the workflow floor
      # rather than adding to it, so "id-token and nothing else" would
      # literally mean no read access at all.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The floor the package itself declares, so this is not a
          # second place the version lives.
          node-version-file: npm/package.json
          registry-url: https://registry.npmjs.org

      # TWO DIFFERENT NUMBERS WITH TWO DIFFERENT REASONS. The package
      # declares the package manager a person installing it needs; this
      # is the one a credential-free publish needs, which is newer and is
      # nobody's business but this job's.
      - name: the package manager here can publish without a credential
        run: |
          set -euo pipefail
          need=11.5.1
          have="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -n1)" != "$need" ]; then
            echo "::error::publishing without a stored credential needs npm >= ${need}; this runner has ${have}"
            exit 1
          fi
          echo "npm ${have}"

      # The digests come from the run that just built the binaries, over
      # the release it just made. gh is on the runner image, so this
      # fetches data and never code.
      - name: take the checksums from the release this run produced
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern checksums.txt \
            --dir dist

      # The only thing that holds the tag, the package version and every
      # key of the shipped table to the same number.
      - name: build the checksum table the package ships
        run: |
          node npm/tools/build-checksums.js \
            --tag "${GITHUB_REF_NAME}" \
            --checksums dist/checksums.txt \
            --out npm/checksums.json

      - name: publish
        working-directory: npm
        run: npm publish --provenance --access public --tag latest

      # THE MEASUREMENT THAT REPLACES A GUESS. This name already carries
      # a published version higher than the one being released, and
      # whether a publish moves the newest pointer in that situation is
      # not written down anywhere. So it is not assumed: the registry is
      # asked, on every release, and a disagreement fails the job rather
      # than shipping a package nobody can install by name.
      #
      # It cannot be two commands. The identity exchange happens inside
      # the publish and the credential it obtains lives in that process
      # only, so a second authenticated command in this job would have
      # nothing to authenticate with.
      - name: the registry agrees about which version is newest
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          tags="$(npm view curiouspub dist-tags --json)"
          echo "${tags}"
          node -e '
            const [, wanted, raw] = process.argv;
            const tags = JSON.parse(raw);
            if (tags.latest !== wanted) {
              console.error(`::error::the registry points at ${tags.latest}, not ${wanted}. ` +
                `Move it by hand with one interactive login and npm dist-tag add.`);
              process.exit(1);
            }
            console.log(`the newest published version is ${tags.latest}`);
          ' "${version}" "${tags}"
