name: Snapshot

# THE POINT OF THIS WORKFLOW is that the release pipeline being broken is
# a pull-request failure rather than a discovery made while cutting a
# release. It runs the whole build matrix, produces every archive and the
# checksum file, and uploads nothing: no credential is available to it,
# and none is needed.
#
# The tap write is skipped in a snapshot build by the tool itself.
# SIGNING IS NOT, and this file used to say it was — a sentence the
# Makefile beside it disproved by passing an explicit flag to skip it.
# That flag was the only thing standing between this check and the
# signing path, and while it stood there, NOTHING exercised that path
# until a real release. The first execution was the first release, which
# failed in it.
#
# So this job signs now, with a key pair generated in the job. That needs
# no identity and no token: a keyless signature needs one, which is why
# signing used to be skipped here — but the arguments that go stale are
# the same either way, and only the IDENTITY has to wait for a release.
on:
  pull_request:
  push:
    branches: [main]
  # THE MERGE QUEUE, because this workflow produces a REQUIRED check.
  # A required check is waited for by name; a workflow that does not fire
  # on the queue's event never produces it, and the entry sits at
  # "awaiting checks" for ever. Measured, on the first run this
  # repository's queue ever had: the queue stalled here.
  merge_group:

permissions:
  contents: read

jobs:
  snapshot:
    name: build every artefact and publish none of them
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The snapshot version is derived from the most recent tag, and
          # a shallow checkout has none.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      # THE SAME SIGNER, AT THE SAME PIN AS THE RELEASE WORKFLOW, and for
      # the same reason the release tool is pinned here: a check that
      # proved a different tool works would prove nothing about the one
      # that publishes.
      #
      # THIS PIN AND THE RELEASE WORKFLOW'S ARE TWO COPIES OF ONE VERSION,
      # AND NOTHING HOLDS THEM EQUAL. Stated rather than implied, because
      # the alternative is the defect this whole change exists to remove:
      # the scheduled update policy bumps action REFERENCES and cannot see
      # a version passed as an input, so both of these move by hand, and
      # two hands can disagree. If they do, this check signs with one
      # signer and the release publishes with another, which is the exact
      # shape of "a check that proves a different tool works".
      #
      # ON CI IT IS INSTALLED, SO AN ABSENT SIGNER IS A FAILURE. The
      # Makefile target below tolerates a missing signer on a developer
      # machine and declares that skip; here there is nothing to tolerate,
      # and a skip would be this check reporting that it ran when it did
      # not.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # install-only, at the SAME exact version the release workflow
      # uses. A pull-request check that proves a different tool works has
      # proved nothing about the one that will publish.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.1
          install-only: true

      # Through the Makefile rather than through the action's own args,
      # so the command this workflow runs is the command a person runs.
      # A check somebody cannot reproduce locally is a check they cannot
      # act on when it fails.
      - name: make snapshot
        shell: bash
        run: make snapshot
