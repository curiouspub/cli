name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      # windows-latest has no GNU Make: the runner image ships MSYS2 but
      # deliberately keeps it off PATH, and `shell: bash` on Windows is
      # Git Bash, whose /usr/bin has none either. Without this the job
      # exits 127 before a single check runs, so the whole reason the
      # matrix includes Windows — path handling, file permissions, the
      # config directory — is never exercised.
      #
      # This is setup, like setup-go above it, so the rule that `make ci`
      # is the single entry point is unaffected: CI still runs that and
      # nothing else.
      - name: Install GNU Make (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install make -y --no-progress

      - name: make ci
        shell: bash
        run: make ci
