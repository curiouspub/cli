name: CI

# EVERY REF, and that is a change with a reason rather than a widening
# for its own sake. The surface check below reads the range a push
# publishes, and a job that never runs catches nothing: filtered to the
# default branch, it would have examined exactly the pushes that had
# already been reviewed and none of the ones where a message is written.
# A tag is included because a tag is a published name carrying a
# published message, and the release workflow is not the only way one
# arrives.
#
# THE MERGE-QUEUE TRIGGER NEEDS A SETTING NOBODY CAN MAKE FROM HERE, and
# saying so is the difference between a trigger and coverage. A squash
# merge composes its commit message out of a pull request's title and
# body, and the queue is where that composed commit can be read before it
# lands. The event only ever fires if the merge queue is enabled on the
# default branch AND this check is marked required, so until an operator
# does both, the line below is a trigger that never fires — which is
# exactly what a check that reads as coverage and is decoration looks
# like. The pull-request job reads the title and body directly, so the
# surface is covered before publication either way; what the queue adds
# is the composed commit itself.
#
# A COMMENT IS NOT WHERE AN UNDONE ACTION LIVES. This one is read by
# whoever next edits this file, which is nobody in particular, and the
# thing it describes is a setting somebody has to go and make. It is
# recorded in CLAUDE.md under the workflow table as well, which is the
# list this repository has for work that cannot be done from inside it.
#
# THE ACTIVITY TYPES ARE NAMED, and `edited` is the reason. A pull
# request's title and body are checked surfaces here, because a squash
# merge composes its commit message out of them — and both can be
# rewritten in a browser after the check has passed. The default set is
# opened, synchronize and reopened; an edit is not in it, so without this
# the title that becomes the commit message is the one nobody read.
#
# Naming the types REPLACES the defaults rather than adding to them,
# which is why all four are spelled out. Dropping `synchronize` here
# would stop this running on every push to a pull request, and nothing
# about the line would look wrong.
on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # THE SUITE NOW ASSERTS SOMETHING ABOUT THIS REPOSITORY'S OWN
          # HISTORY, so it needs that history. The surface checker proves
          # itself against a real commit before it is trusted with a
          # range, and that is an object rather than a fixture on purpose:
          # a fixture file holding a private identifier is the leak
          # arriving through the check that hunts it. A shallow checkout
          # cannot answer whether the checker works, and the rows say so
          # rather than skipping.
          #
          # WHAT IT COSTS, said here because it arrived without being
          # said: this is a full clone of every branch and tag on every
          # run of every leg of the matrix, rather than the single commit
          # a default checkout fetches. The repository is small and the
          # cost is seconds today; it grows with the history, and the day
          # somebody wants that back, the thing to move is the rows that
          # read real commits, not this line.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      # windows-latest has no GNU Make: the runner image ships MSYS2 but
      # deliberately keeps it off PATH, and `shell: bash` on Windows is
      # Git Bash, whose /usr/bin has none either. Without this the job
      # exits 127 before a single check runs, so the whole reason the
      # matrix includes Windows — path handling, file permissions, the
      # config directory — is never exercised.
      #
      # This is setup, like setup-go above it, so the rule that `make ci`
      # is the single entry point is unaffected: CI still runs that and
      # nothing else.
      - name: Install GNU Make (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install make -y --no-progress

      - name: make ci
        shell: bash
        run: make ci

  # THE SURFACES `make ci` CANNOT SEE. The suite above reads file
  # contents; a commit message, a branch name, a tag and a pull request's
  # own text are published exactly as loudly and are not files. This job
  # reads the range being published and fails on what it finds there.
  #
  # ONE LEG, not the matrix. It reads git objects and text, which is the
  # same answer on every operating system, and the three-way matrix exists
  # for path handling and permissions — neither of which this touches. A
  # leg that can only agree with its siblings is a leg that costs minutes
  # to restate a result.
  surfaces:
    name: the published surfaces that are not files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A range needs both of its own endpoints, and a shallow
          # checkout has neither. `git merge-base`, `git log base..head`
          # and reading a file at the base all want history that is not
          # there — and a range that silently resolves to nothing is this
          # check's whole failure mode, so it is stated here rather than
          # assumed.
          #
          # IT IS ALSO WHAT PUTS THE DEFAULT BRANCH IN THE CHECKOUT, and
          # that is load bearing rather than incidental. A push of a NEW
          # ref carries no before-sha, so what is new has to be measured
          # against the default branch — and the checkout action fetches
          # only the pushed ref UNLESS the depth is unbounded, in which
          # case it fetches every head and tag. Read at the pinned commit
          # below rather than remembered. Reduce this to a number and the
          # first branch anybody creates fails undetermined, blaming a
          # shallow checkout, which is true and unhelpful.
          #
          # The cost is a full clone on every run. One leg, and this
          # repository is small.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      # Through the Makefile, so the command this workflow runs is the
      # command a person runs — and the same one the optional pre-push
      # hook runs. The event is read out of the payload file by the
      # program itself: a pull request's title and body are written by
      # whoever opened it, and interpolating that into a shell line here
      # would hand a stranger the runner.
      - name: make surface-check
        shell: bash
        run: make surface-check
