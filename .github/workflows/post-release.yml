# The exit test's post-release rows that a machine can run, against what a
# release actually published. They run after every release, and on demand
# for a version already out, so they are repeatable rather than something a
# person does once on one machine.
#
# NOTHING HERE PUBLISHES OR HOLDS A CREDENTIAL. It installs what strangers
# install, the way they install it, and checks what it says it is.

name: Post-release

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: the released version to check, without a leading v
        required: true

permissions:
  contents: read

jobs:
  brew-linux:
    name: the formula installs on Linux from a tap nobody added
    # A release that did not finish published nothing worth installing.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # The runner image carries the package manager but does not put it on
      # PATH. No tap is added first: `brew install owner/tap/name` taps on
      # its own, which is the path a stranger takes. The version the binary
      # reports is checked against the release, and that check is what pins
      # an install that cannot name a version.
      - name: install the formula and check the version it reports
        env:
          WANT: ${{ inputs.version }}
          RELEASED: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          want="${WANT:-${RELEASED#v}}"
          if [ -z "$want" ]; then
            echo "::error::no version to check"
            exit 1
          fi
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install curiouspub/tap/curiouspub
          got="$(curious version)"
          echo "$got"
          case " $got " in
            *" $want "*) echo "installed $want, as released" ;;
            *) echo "::error::the formula installed '$got', and the release is $want"; exit 1 ;;
          esac
