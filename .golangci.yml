# golangci-lint configuration, in the version 2 schema.
#
# LINT GATES, OVER THREE CLASSES OF FINDING AND A LINTER OVER THE //nolint
# DIRECTIVES THEMSELVES, AND NO OTHERS: declarations nothing uses
# (unused), staticcheck's correctness checks (its SA family), an
# assignment whose value nothing reads (ineffassign), and the directives
# (nolintlint). Every other linter is off, and the reason is a measurement
# rather than a preference.
#
# Measured 2026-10-05 with golangci-lint 2.14.0: the linter's default set
# was run over this tree with every finding printed, and all three CI legs
# reported the same 110.
#
#   - errcheck: 93, and every one was false. Each was a write to a
#     terminal or a report stream that the program cannot act on when it
#     fails, where the exit status already carries the verdict, or a Close
#     on something opened only for reading. errcheck cannot tell a Close
#     that could lose a write from one that cannot, by the name it reads,
#     so there is no narrower form of it to keep.
#   - staticcheck's style families (S1, ST and QF): 10. Nine were rewrites
#     of code that already reads clearly. The tenth would have done damage:
#     it asked for a fmt.Sprintf("%s", value) to become the value itself,
#     inside the positive control of a redaction test, where formatting
#     through that verb is the very path the control exists to run.
#   - unused and the SA family: 7, and all signal. Four dead declarations
#     and one deprecated call were fixed. Two lines that exist to prove
#     something stay, each with an annotation on the line saying what it
#     proves and why the linter is wrong about it.
#
# So the classes that are off produced nothing worth changing and one
# change that would have weakened a test; the classes that are on produced
# nothing else. govet and ineffassign, the rest of the default set,
# reported nothing. govet stays off because vet already runs, as its own
# step of make ci.
#
# INEFFASSIGN AND NOLINTLINT joined on 2026-10-06, with the same linter:
# with both enabled the tree still reports nothing, and the two
# annotations already satisfy nolintlint, so neither needed a change to
# any code. ineffassign is a correctness class that costs nothing today.
# nolintlint is what keeps an annotation honest. Every directive must give
# a reason and must name the linter it silences, whichever linter that
# is; and a directive naming a linter enabled here is a finding when it
# excuses nothing on its line. Without it, an annotation that stops being
# needed stays silent for ever and goes on silencing its line.
#
# WHAT THIS DOES NOT SEE: an unchecked error is not linted at all. A
# directive naming a disabled linter that excuses nothing passes, as long
# as it gives a reason; one naming a linter the tool does not know is a
# warning that leaves the exit status alone. And a directive narrows to a
# linter, never to one of its checks: at this version a //nolint naming a
# single staticcheck check is not understood, so the narrowest staticcheck
# directive silences every correctness check on its line. One line in the
# tree carries one.
version: "2"

linters:
  default: none
  enable:
    - staticcheck
    - unused
    - ineffassign
    - nolintlint
  settings:
    staticcheck:
      # The correctness checks only, for the reason above.
      checks:
        - "SA*"
    nolintlint:
      # A directive naming an enabled linter that excuses nothing is a
      # finding. This is the linter's default, written down because the
      # gate relies on it and a later version could move a default without
      # anyone choosing to.
      allow-unused: false
      # A directive says why, after the directive itself.
      require-explanation: true
      # A directive names the linter it silences.
      require-specific: true
